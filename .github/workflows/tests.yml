name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust-and-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Test source build
        run: PEDAL_BINARY=target/release/elgato-foot-pedal python3 -m unittest discover -s tests -v
      - name: Verify and test bundled binary
        run: |
          sha256sum --check bin/SHA256SUMS
          test "$(bin/foot-pedal --version)" = "$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: elgato-foot-pedal-linux-x86_64
          path: target/release/elgato-foot-pedal
